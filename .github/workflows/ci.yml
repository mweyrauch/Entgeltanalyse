name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src scripts tests

      - name: Unit-Tests
        run: pytest -q

      - name: Kurze Simulationsstudie
        run: |
          python scripts/analyze.py --scenario proxy --seed 1
          python scripts/run_study.py --reps 3 --n 1500 --out-dir results/ci

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-studie
          path: results/ci
          retention-days: 7
