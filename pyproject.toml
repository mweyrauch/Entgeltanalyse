[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paygap"
version = "0.1.0"
description = "Bereinigte Entgeltluecke mit klassischen und ML-Methoden auf synthetischen Personaldaten"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.4",   # categorical_features="from_dtype"
    "pyyaml",
    "matplotlib>=3.10",    # boxplot(orientation=...)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["paygap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
